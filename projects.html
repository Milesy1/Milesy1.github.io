<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Miles Waite - Projects</title>

    <link rel="icon" href="images.png" type="image/png" />

    <!-- Inter font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="projects.css">

    <!-- p5.js for background -->
    <script src="https://cdn.jsdelivr.net/npm/p5@1.7.0/lib/p5.min.js"></script>

    <!-- Analytics -->

<body>

<div id="header"></div>
<script>
    async function loadHeader() {
        const headerUrl = 'header.html?cache=' + new Date().getTime();
        document.getElementById('header').innerHTML = await (await fetch(headerUrl)).text();
    }
    loadHeader();
</script>

<main>
    <h1 class="main-heading">Projects</h1>

    <div class="cards-container">
        <div class="card">Audio Reactive Abstract Geometry</div>
        <div class="card">Particle Systems</div>
        <div class="card">API Text DAT</div>
        <div class="card">Generative Max for Live Tools</div>
    </div>
</main>

<div id="footer"></div>
<script>
    async function loadFooter() {
        document.getElementById('footer').innerHTML = await (await fetch('footer.html')).text();
    }
    loadFooter();
</script>

<!-- p5.js background script -->
<script src="projects-bg.js"></script>

</body>
</html>
