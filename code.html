    <style>
        html, body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        body {
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #d3d3d3;
            color: var(--text-color, #000);
            transition: background-color 1.5s ease, color 1.5s ease;
        }

        header, footer {
            display: flex;
            justify-content: center;
            gap: 3rem;
            padding: 1.5rem 0;
            font-weight: 700;
            font-size: 1.25rem;
            user-select: none;
            letter-spacing: 0.08em;
            width: 100%;
            max-width: 1000px;
            box-sizing: border-box;
            font-family: 'Manrope', sans-serif;
            text-align: center;
            margin: 0 auto;
        }

        header a, footer a {
            cursor: pointer;
            position: relative;
            padding-bottom: 4px;
            text-decoration: none;
            color: inherit;
        }

        header a::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 3px;
            background: currentColor;
            transform: scaleX(0);
            transform-origin: right;
            transition: transform 0.3s ease;
        }

        header a:hover::after {
            transform: scaleX(1);
            transform-origin: left;
        }

        footer a img {
            width: 24px;
            height: 24px;
            filter: invert(0);
            transition: transform 0.2s ease;
        }

        footer a img:hover {
            transform: scale(1.2);
        }

        main {
            max-width: 900px;
            padding: 2rem 1rem;
            width: 100%;
            box-sizing: border-box;
            font-size: 1.1rem;
            line-height: 1.6;
            flex: 1;
            margin: 0 auto;
        }

        @media (max-width: 600px) {
            header, footer {
                gap: 1.5rem;
                padding: 1rem 0;
                font-size: 1rem;
            }
        }
    </style>
