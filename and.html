<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Miles Waite - About</title>

  <!-- Favicon -->
  <link rel="icon" href="images.png" type="image/png" />

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700&display=swap" rel="stylesheet" />

  <!-- Analytics -->
  <script defer data-domain="mileswaite.net" src="https://plausible.io/js/script.js"></script>

  <!-- Styles -->
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="music.css" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      font-family: 'Manrope', sans-serif;
      background-color: #d3d3d3;
      color: var(--text-color, #000);
    }

    main {
      flex: 1;
      width: 90%;
      max-width: 1000px;
      margin: 2rem auto;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    main h1 {
      text-align: center;
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }

    section h2 {
      font-size: 1.75rem;
      margin-bottom: 0.5rem;
    }

    section p {
      font-size: 1rem;
      line-height: 1.5;
    }

    @media (max-width: 600px) {
      main {
        width: 95%;
        gap: 1.5rem;
      }
      main h1 {
        font-size: 2rem;
      }
      section h2 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div id="header"></div>
  <script>
    async function loadHeader() {
      const headerResp = await fetch('header.html?cache=' + new Date().getTime());
      document.getElementById('header').innerHTML = await headerResp.text();
    }
    loadHeader();
  </script>

  <!-- Main Content -->
  <main>
    <h1>&</h1>

    <section>
      <h2>About</h2>
      <p>Developer & TouchDesigner artist</p>
    </section>

    <section>
      <h2>Other Artists</h2>
      <p>Ingebar_music</p>
    </section>

    <section>
      <h2>Hardware</h2>
      <p>Pittsburgh Lifeforms / Presonus Studio 1810</p>
    </section>
  </main>

  <!-- Footer -->
  <div id="footer"></div>
  <script>
    async function loadFooter() {
      document.getElementById('footer').innerHTML = await (await fetch('footer.html')).text();
    }
    loadFooter();
  </script>

</body>
</html>
