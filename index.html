<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />

    <!-- Plausible Analytics -->

    <style>
        /* Reset & layout */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            background-color: #d3d3d3;
            color: var(--text-color);
            transition: background-color 1.5s ease, color 1.5s ease;
            align-items: center;
        }

        :root {
            --bg-black: #000;
            --bg-white: #fff;
            --text-white: #fff;
            --text-black: #000;
            --yellow-bright: #fff822;
            --blue-bright: #2288ff;
            --red-bright: #ff2222;
        }

        body.black-theme {
            --bg-color: var(--bg-black);
            --text-color: var(--text-white);
        }

        body.white-theme {
            --bg-color: var(--bg-white);
            --text-color: var(--text-black);
        }

        header {
            display: flex;
            justify-content: center;
            gap: 3rem;
            padding: 1.5rem 0;
            font-weight: 700;
            font-size: 1.25rem;
            user-select: none;
            letter-spacing: 0.08em;
            width: 100%;
            max-width: 1000px;
            box-sizing: border-box;
            font-family: 'Manrope', sans-serif;
            text-align: center;
        }

        header a {
            cursor: pointer;
            position: relative;
            padding-bottom: 4px;
            text-decoration: none;
            color: inherit;
        }

        header a::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 3px;
            background: currentColor;
            transform: scaleX(0);
            transform-origin: right;
            transition: transform 0.3s ease;
        }

        header a:hover::after {
            transform: scaleX(1);
            transform-origin: left;
        }

        #canvas-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        #canvas-container {
            position: relative;
            width: 540px;
            height: 540px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #square-bg {
            width: 378px;
            height: 378px;
            border-radius: 6px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            z-index: 0;
        }

        canvas {
            z-index: 1;
            display: block;
            outline: none;
        }

        footer {
            display: flex;
            justify-content: center;
            gap: 2rem;
            padding: 2rem 0 1.5rem;
        }

        footer a img {
            width: 24px;
            height: 24px;
            filter: invert(0);
            transition: transform 0.2s ease;
        }

        footer a img:hover {
            transform: scale(1.2);
        }

        @media (max-width: 600px) {
            header {
                gap: 1.5rem;
                padding: 1rem 0;
                font-size: 1rem;
            }

            #canvas-container {
                width: 90vw;
                height: 90vw;
                max-width: 400px;
                max-height: 400px;
            }

            #square-bg {
                width: 70vw;
                height: 70vw;
                max-width: 280px;
                max-height: 280px;
            }
        }
    </style>
</head>

<body>
<header>
    <a href="projects.html">Projects</a>
    <a href="music.html">Music</a>
    <a href="code.html">Code</a>
</header>

<div id="canvas-wrapper">
    <div id="canvas-container">
        <div id="square-bg"></div>
    </div>
</div>

<footer>
    <a href="mailto:miles.waite@protonmail.com" aria-label="Email">
        <img src="https://proton.me/static/images/logos/proton-mail-icon.svg" alt="ProtonMail" />
    </a>
    <a href="https://github.com/mileswaite" target="_blank" aria-label="GitHub">
        <img src="https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/github.svg" alt="GitHub" />
    </a>
    <a href="https://www.instagram.com/mileswaite" target="_blank" aria-label="Instagram">
        <img src="https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/instagram.svg" alt="Instagram" />
    </a>
</footer>

<script>
    const isBlackTheme = Math.random() < 0.5;
    document.body.classList.add(isBlackTheme ? 'black-theme' : 'white-theme');

    const squareBg = document.getElementById('square-bg');
    squareBg.style.backgroundColor = isBlackTheme ? '#fff' : '#000';

    let angle = 0;
    let innerColorCycle = 0;
    let cubeAlpha = 0;

    const canvasContainer = document.getElementById('canvas-container');

    new p5((p) => {
        p.setup = function () {
            p.createCanvas(540, 540, p.WEBGL).parent(canvasContainer);
            p.noFill();
            p.strokeWeight(2);
        };

        p.draw = function () {
            p.background(getComputedStyle(document.body).getPropertyValue('--bg-color').trim());

            const camRadius = 850;
            const camX = p.cos(angle * 0.3) * camRadius;
            const camY = -100;
            const camZ = p.sin(angle * 0.3) * camRadius;
            p.camera(camX, camY, camZ, 0, 0, 0, 0, 1, 0);

            if (cubeAlpha < 255) cubeAlpha += 2;

            p.push();
            p.stroke(isBlackTheme ? p.color(255, 255, 255, cubeAlpha) : p.color(0, 0, 0, cubeAlpha));
            p.rotateX(angle * 0.5);
            p.rotateY(angle);
            drawCube(p, 360);
            p.pop();

            p.push();
            p.rotateX(-angle * 0.8);
            p.rotateZ(angle * 0.3);
            innerColorCycle += 0.01;
            if (innerColorCycle > p.TWO_PI) innerColorCycle = 0;

            let rC, gC, bC;
            const phase = innerColorCycle;

            if (isBlackTheme) {
                if (phase < p.TWO_PI / 3) {
                    const t = phase / (p.TWO_PI / 3);
                    rC = 255;
                    gC = 255 * (1 - t);
                    bC = 255 * (1 - t);
                } else if (phase < (2 * p.TWO_PI) / 3) {
                    const t = (phase - p.TWO_PI / 3) / (p.TWO_PI / 3);
                    rC = 255 * (1 - t);
                    gC = 0;
                    bC = 255 * t;
                } else {
                    const t = (phase - (2 * p.TWO_PI) / 3) / (p.TWO_PI / 3);
                    rC = 255 * t;
                    gC = 255 * t;
                    bC = 255;
                }
            } else {
                const yellow = { r: 255, g: 248, b: 34 };
                const blue = { r: 34, g: 136, b: 255 };
                if (phase < p.TWO_PI / 3) {
                    const t = phase / (p.TWO_PI / 3);
                    rC = yellow.r * t;
                    gC = yellow.g * t;
                    bC = yellow.b * t;
                } else if (phase < (2 * p.TWO_PI) / 3) {
                    const t = (phase - p.TWO_PI / 3) / (p.TWO_PI / 3);
                    rC = yellow.r + (blue.r - yellow.r) * t;
                    gC = yellow.g + (blue.g - yellow.g) * t;
                    bC = yellow.b + (blue.b - yellow.b) * t;
                } else {
                    const t = (phase - (2 * p.TWO_PI) / 3) / (p.TWO_PI / 3);
                    rC = blue.r * (1 - t);
                    gC = blue.g * (1 - t);
                    bC = blue.b * (1 - t);
                }
            }

            p.stroke(p.color(rC, gC, bC, cubeAlpha));
            drawCube(p, 144);
            p.pop();

            angle += 0.0065;
        };

        function drawCube(p, size) {
            p.box(size);
        }
    }, canvasContainer);
</script>
</body>
</html>
