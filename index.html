<body>
  <!-- Header placeholder -->
  <div id="header"></div>

  <script>
    async function loadHeader() {
      const headerUrl = 'header.html?cache=' + new Date().getTime();
      const headerResp = await fetch(headerUrl);
      document.getElementById('header').innerHTML = await headerResp.text();
    }
    loadHeader();
  </script>

  <div id="canvas-wrapper">
    <div id="canvas-container">
      <div id="square-bg"></div>
    </div>
  </div>

  <!-- Footer placeholder -->
  <div id="footer"></div>
  <script>
    async function loadFooter() {
      document.getElementById('footer').innerHTML =
        await (await fetch('footer.html')).text();
    }
    loadFooter();
  </script>

  <!-- p5.js sketch -->
  <script>
    const isBlackTheme = Math.random() < 0.5;
    document.body.classList.add(isBlackTheme ? 'black-theme' : 'white-theme');

    const squareBg = document.getElementById('square-bg');
    squareBg.style.backgroundColor = isBlackTheme ? '#fff' : '#000';

    let angle = 0;
    let innerColorCycle = 0;
    let cubeAlpha = 0;

    const canvasContainer = document.getElementById('canvas-container');

    new p5((p) => {
      p.setup = function () {
        p.createCanvas(540, 540, p.WEBGL).parent(canvasContainer);
        p.noFill(); // ensure wireframe
        p.strokeWeight(2);
      };

      p.keyPressed = function () {
        if (p.key === 's' || p.key === 'S') {
          p.saveCanvas('screenshot', 'png');
        }
      };

      p.draw = function () {
        p.background(
          getComputedStyle(document.body).getPropertyValue('--bg-color').trim()
        );

        // Camera
        const camRadius = 850;
        const camX = p.cos(angle * 0.3) * camRadius;
        const camY = -100;
        const camZ = p.sin(angle * 0.3) * camRadius;
        p.camera(camX, camY, camZ, 0, 0, 0, 0, 1, 0);

        if (cubeAlpha < 255) cubeAlpha += 2;

        // Outer cube
        p.push();
        p.noFill();
        p.stroke(isBlackTheme ? p.color(255, 255, 255, cubeAlpha) : p.color(0, 0, 0, cubeAlpha));
        p.rotateX(angle * 0.5);
        p.rotateY(angle);
        drawCube(p, 360);
        p.pop();

        // Inner cube with cycling colors
        p.push();
        p.noFill();
        p.rotateX(-angle * 0.8);
        p.rotateZ(angle * 0.3);
        innerColorCycle += 0.01;
        if (innerColorCycle > p.TWO_PI) innerColorCycle = 0;

        let rC, gC, bC;
        const phase = innerColorCycle;

        if (isBlackTheme) {
          if (phase < p.TWO_PI / 3) {
            const t = phase / (p.TWO_PI / 3);
            rC = 255; gC = 255 * (1 - t); bC = 255 * (1 - t);
          } else if (phase < (2 * p.TWO_PI) / 3) {
            const t = (phase - p.TWO_PI / 3) / (p.TWO_PI / 3);
            rC = 255 * (1 - t); gC = 0; bC = 255 * t;
          } else {
            const t = (phase - (2 * p.TWO_PI) / 3) / (p.TWO_PI / 3);
            rC = 255 * t; gC = 255 * t; bC = 255;
          }
        } else {
          const yellow = { r: 255, g: 248, b: 34 };
          const blue = { r: 34, g: 136, b: 255 };
          if (phase < p.TWO_PI / 3) {
            const t = phase / (p.TWO_PI / 3);
            rC = yellow.r * t; gC = yellow.g * t; bC = yellow.b * t;
          } else if (phase < (2 * p.TWO_PI) / 3) {
            const t = (phase - p.TWO_PI / 3) / (p.TWO_PI / 3);
            rC = yellow.r + (blue.r - yellow.r) * t;
            gC = yellow.g + (blue.g - yellow.g) * t;
            bC = yellow.b + (blue.b - yellow.b) * t;
          } else {
            const t = (phase - (2 * p.TWO_PI) / 3) / (p.TWO_PI / 3);
            rC = blue.r * (1 - t);
            gC = blue.g * (1 - t);
            bC = blue.b * (1 - t);
          }
        }

        p.stroke(p.color(rC, gC, bC, cubeAlpha));
        drawCube(p, 144);
        p.pop();

        angle += 0.0065;
      };

      function drawCube(p, size) {
        p.box(size);
      }
    }, canvasContainer);
  </script>
</body>
</html>
