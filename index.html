<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Miles Waite</title>

  <link rel="icon" href="images.png" type="image/png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/p5@1.6.0/lib/p5.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body id="index-page">

  <!-- Header -->
  <div id="header"></div>
  <script>
    async function loadHeader() {
      let html = await (await fetch('header.html?cache=' + new Date().getTime())).text();
      const temp = document.createElement('div');
      temp.innerHTML = html;

      // Remove signature on mobile index page
      if (window.innerWidth <= 600 && document.body.id === 'index-page') {
        const sig = temp.querySelector('.site-signature');
        if (sig) sig.remove();
      }

      document.getElementById('header').innerHTML = temp.innerHTML;

      // Highlight current page
      const links = document.querySelectorAll("#header a");
      const current = window.location.pathname.split("/").pop();
      links.forEach(link => {
        if (link.getAttribute("href") === current) {
          link.setAttribute("aria-current", "page");
        }
      });
    }
    loadHeader();
  </script>

  <!-- Canvas -->
  <div id="canvas-wrapper">
    <div id="canvas-container">
      <div id="square-bg"></div>
    </div>
  </div>

  <!-- Footer -->
  <div id="footer"></div>
  <script>
    async function loadFooter() {
      document.getElementById('footer').innerHTML = await (await fetch('footer.html')).text();
    }
    loadFooter();
  </script>

  <!-- p5.js sketch -->
  <script>
    const isBlackTheme = Math.random() < 0.5;
    document.body.classList.add(isBlackTheme ? 'black-theme' : 'white-theme');

    let angle = 0;
    let innerColorCycle = 0;
    let cubeAlpha = 0;
    const canvasContainer = document.getElementById('canvas-container');

    new p5((p) => {
      function resizeCanvasToContainer() {
        const w = canvasContainer.offsetWidth;
        p.resizeCanvas(w, w);
      }

      p.setup = function () {
        const w = canvasContainer.offsetWidth;
        p.createCanvas(w, w, p.WEBGL).parent(canvasContainer);
        p.noFill();
        p.strokeWeight(2);
      };

      p.windowResized = resizeCanvasToContainer;

      p.keyPressed = function () {
        if (p.key === 's' || p.key === 'S') p.saveCanvas('screenshot', 'png');
      };

      p.draw = function () {
        const bgColor = isBlackTheme ? 0 : 255;
        if (cubeAlpha < 255) cubeAlpha += 2;
        p.background(bgColor);

        const camRadius = 850;
        const camX = p.cos(angle * 0.3) * camRadius;
        const camY = -100;
        const camZ = p.sin(angle * 0.3) * camRadius;
        p.camera(camX, camY, camZ, 0, 0, 0, 0, 1, 0);

        // Outer cube
        p.push();
        p.noFill();
        p.stroke(isBlackTheme ? p.color(255,255,255,cubeAlpha) : p.color(0,0,0,cubeAlpha));
        p.rotateX(angle * 0.5);
        p.rotateY(angle);
        p.box(360);
        p.pop();

        // Inner cube
        p.push();
        p.noFill();
        p.rotateX(-angle*0.8);
        p.rotateZ(angle*0.3);
        innerColorCycle += 0.01;
        if (innerColorCycle > p.TWO_PI) innerColorCycle = 0;

        let rC,gC,bC;
        const phase = innerColorCycle;
        if (isBlackTheme) {
          if (phase < p.TWO_PI/3){ const t = phase/(p.TWO_PI/3); rC=255; gC=255*(1-t); bC=255*(1-t); }
          else if (phase<(2*p.TWO_PI/3)){ const t=(phase-p.TWO_PI/3)/(p.TWO_PI/3); rC=255*(1-t); gC=0; bC=255*t; }
          else{ const t=(phase-2*p.TWO_PI/3)/(p.TWO_PI/3); rC=255*t; gC=255*t; bC=255; }
        } else {
          const yellow={r:255,g:248,b:34}, blue={r:34,g:136,b:255};
          if (phase<p.TWO_PI/3){ const t=phase/(p.TWO_PI/3); rC=yellow.r*t; gC=yellow.g*t; bC=yellow.b*t; }
          else if (phase<(2*p.TWO_PI/3)){ const t=(phase-p.TWO_PI/3)/(p.TWO_PI/3); rC=yellow.r+(blue.r-yellow.r)*t; gC=yellow.g+(blue.g-yellow.g)*t; bC=yellow.b+(blue.b-yellow.b)*t; }
          else{ const t=(phase-2*p.TWO_PI/3)/(p.TWO_PI/3); rC=blue.r*(1-t); gC=blue.g*(1-t); bC=blue.b*(1-t); }
        }
        p.stroke(p.color(rC,gC,bC,cubeAlpha));
        p.box(144);
        p.pop();

        angle += 0.0065;
      };
    }, canvasContainer);
  </script>
</body>
</html>
